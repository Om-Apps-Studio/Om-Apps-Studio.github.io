<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocFilter - Word Processor</title>
    <!-- JSZip required by docx-preview -->
    <script src="https://unpkg.com/jszip/dist/jszip.min.js"></script>
    <!-- Docx-Preview -->
    <script src="https://unpkg.com/docx-preview/dist/docx-preview.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-app: #f4f7f6;
            --bg-surface: rgba(255, 255, 255, 0.85);
            --bg-sidebar: rgba(248, 250, 252, 0.7);
            --primary: #3b82f6;
            --primary-alpha: rgba(59, 130, 246, 0.15);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: rgba(226, 232, 240, 0.8);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            --radius-md: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --glass-blur: blur(16px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-app);
            color: var(--text-main);
            /* Add a subtle background gradient for a premium feel */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.7);
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Main Wrapper (right side of sidebar) */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Glassmorphism Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* Glassmorphism Toolbar */
        .toolbar {
            height: 60px;
            background-color: var(--bg-surface);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            z-index: 100;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            border-right: 1px solid var(--border-color);
            padding-right: 10px;
            margin-right: 2px;
            flex-shrink: 0;
        }

        .toolbar-group:last-child {
            border-right: none;
            padding-right: 0;
            margin-right: 0;
            flex: 1 1 auto;
            justify-content: flex-end;
        }

        .tool-btn {
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            transition: var(--transition);
            font-size: 18px;
        }

        .tool-btn:hover {
            background-color: var(--primary-alpha);
            color: var(--primary);
        }

        .tool-btn.active {
            background-color: var(--primary-alpha);
            color: var(--primary);
        }

        .zoom-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        /* Sidebar Elements */
        .brand {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            color: var(--primary);
            border-bottom: 1px solid var(--border-color);
        }

        .toc-header {
            padding: 16px 24px 8px 24px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toc-list {
            list-style: none;
            overflow-y: auto;
            flex: 1;
            padding: 8px 16px 24px 16px;
        }

        .toc-item {
            padding: 8px 12px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
        }

        .toc-item:hover {
            background-color: var(--border-color);
        }

        .toc-item.active {
            background-color: var(--primary-alpha);
            color: var(--primary);
            font-weight: 600;
        }

        .toc-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            color: var(--text-muted);
            border-radius: 4px;
        }

        .toc-icon:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        /* Upload Area */
        .upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: var(--transition);
        }

        .upload-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .upload-card {
            background-color: var(--bg-surface);
            border: 2px dashed var(--primary);
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: var(--transition);
        }

        .upload-card:hover {
            transform: scale(1.02);
            box-shadow: 0 25px 50px rgba(59, 130, 246, 0.15);
        }

        #fileInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Document Reading Area */
        .main-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            padding: 80px 40px 40px 40px;
            /* offset for toolbar */
            background: transparent;
        }

        #documentContainer {
            width: 100%;
            display: flex;
            justify-content: center;
            transform-origin: top center;
            transition: transform 0.2s ease;
        }

        /* Ensure docx-preview wrapper looks exactly like Word */
        .docx-wrapper {
            background: transparent !important;
            padding: 0 !important;
        }

        .docx-wrapper>section.docx {
            background: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            margin-bottom: 24px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }

        /* Word-Level Highlight Styles */
        .tts-word-active {
            background-color: #fef08a !important;
            /* Tailwind Yellow 200 */
            color: #1e3a8a !important;
            /* Tailwind Blue 900 */
            border-radius: 4px;
            box-shadow: 0 0 0 2px #fef08a;
            transition: all 0.15s ease-out;
            position: relative;
            z-index: 1;
        }

        .tts-block-active {
            border-left: 4px solid var(--primary) !important;
            background-color: var(--primary-alpha) !important;
            transition: all 0.3s ease;
        }

        /* Filtering styles */
        .hidden-node {
            display: none !important;
        }

        /* Search Results Styles */
        .search-result-item {
            background-color: var(--bg-surface);
            border-radius: var(--radius-md);
            padding: 24px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
        }

        .search-result-item:hover {
            box-shadow: var(--shadow-md);
            transform: translateX(4px);
        }

        .search-result-text {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-main);
        }

        mark {
            background-color: rgba(250, 204, 21, 0.4);
            color: inherit;
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 600;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            font-weight: 500;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--bg-app);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 6px 12px;
            width: 260px;
            max-width: 280px;
            min-width: 140px;
            flex: 1 1 auto;
        }

        .search-bar input {
            border: none;
            background: transparent;
            outline: none;
            margin-left: 8px;
            width: 100%;
            color: var(--text-main);
        }

        /* Sidebar Backdrop Overlay */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .mobile-toggle-btn {
            display: none;
        }

        .mobile-close-btn {
            display: none;
        }

        /* Mobile Media Queries */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
                position: relative;
            }

            .mobile-toggle-btn {
                display: flex;
            }

            .mobile-close-btn {
                display: flex;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 290px;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .toolbar {
                height: auto;
                min-height: 56px;
                padding: 8px 12px;
                flex-wrap: wrap;
                gap: 8px;
                position: sticky;
                top: 0;
                left: 0;
                right: 0;
                box-shadow: var(--shadow-sm);
            }

            .toolbar-group {
                padding-right: 8px;
                margin-right: 8px;
                gap: 4px;
            }

            .toolbar-group:last-child {
                width: 100%;
                margin-left: 0 !important;
                margin-top: 4px;
                align-items: stretch !important;
            }

            .search-bar {
                width: 100% !important;
            }

            .main-content {
                padding: 16px 8px 32px 8px;
                overflow-x: hidden;
            }

            #documentContainer {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            .docx-wrapper {
                padding: 0 !important;
            }

            .docx-wrapper>section.docx {
                width: 100% !important;
                max-width: 100% !important;
                min-width: 0 !important;
                padding: 16px 12px !important;
                margin-bottom: 16px !important;
                box-sizing: border-box !important;
                box-shadow: none !important;
                border-radius: 8px !important;
            }

            /* Responsive tables and media */
            section.docx table {
                max-width: 100% !important;
                display: block !important;
                overflow-x: auto !important;
                -webkit-overflow-scrolling: touch;
            }

            section.docx img,
            section.docx svg,
            section.docx canvas {
                max-width: 100% !important;
                height: auto !important;
            }

            .upload-card {
                padding: 24px 16px;
                max-width: 90%;
            }
        }

        /* Heading Filter Dropdown & Collapsible Tree Styles */
        .filter-dropdown-group {
            position: relative;
            display: inline-block;
        }

        .filter-dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            width: 380px;
            max-width: calc(100vw - 24px);
            max-height: 82vh;
            background-color: var(--bg-surface);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.18);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: dropdownFadeIn 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .filter-dropdown-menu.active {
            display: flex;
        }

        @keyframes dropdownFadeIn {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .filter-dropdown-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(248, 250, 252, 0.6);
        }

        .filter-search-box {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            flex: 1;
        }

        .filter-search-box input {
            border: none;
            outline: none;
            font-size: 13px;
            width: 100%;
            margin-left: 6px;
            color: var(--text-main);
            background: transparent;
        }

        .filter-actions-group {
            display: flex;
            gap: 4px;
        }

        .btn-secondary {
            background-color: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-secondary:hover {
            background-color: rgba(59, 130, 246, 0.08);
            color: var(--primary);
            border-color: var(--primary-alpha);
        }

        .filter-dropdown-body {
            padding: 10px 14px;
            overflow-y: auto;
            flex: 1;
            max-height: 380px;
        }

        .filter-tree-node {
            margin-bottom: 2px;
        }

        .filter-tree-row {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .filter-tree-row:hover {
            background-color: var(--primary-alpha);
        }

        .chevron-toggle {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 4px;
            color: var(--text-muted);
            transition: background 0.15s ease;
        }

        .chevron-toggle:hover {
            background-color: rgba(0, 0, 0, 0.08);
            color: var(--primary);
        }

        .chevron-toggle i {
            transition: transform 0.2s ease;
            font-size: 13px;
        }

        .chevron-toggle.expanded i {
            transform: rotate(90deg);
        }

        .chevron-spacer {
            width: 22px;
            height: 22px;
            display: inline-block;
            margin-right: 4px;
        }

        .filter-tree-children {
            display: none;
            margin-top: 2px;
            margin-bottom: 4px;
            border-left: 1.5px dashed rgba(148, 163, 184, 0.4);
            margin-left: 10px;
        }

        .filter-tree-children.expanded {
            display: block;
        }

        .level-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            text-transform: uppercase;
        }

        .level-badge.l1 {
            background: #dbeafe;
            color: #1e40af;
        }

        .level-badge.l2 {
            background: #e0e7ff;
            color: #3730a3;
        }

        .level-badge.l3 {
            background: #f3e8ff;
            color: #6b21a8;
        }

        .filter-tree-text {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 500;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .filter-dropdown-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            background-color: rgba(248, 250, 252, 0.7);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .filter-status-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <!-- Sidebar Backdrop Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar(false)"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <i class="ph-fill ph-file-word"></i>
                <span>DocFilter Pro</span>
                <button class="tool-btn mobile-close-btn" onclick="toggleMobileSidebar(false)" title="Close Navigation">
                    <i class="ph ph-x"></i>
                </button>
            </div>

            <div class="toc-header">
                <span>Navigation Pane</span>
                <div style="display: flex; gap: 4px;">
                    <button class="tool-btn" style="width: 28px; height: 28px; font-size: 16px;"
                        onclick="toggleFilterDropdown()" title="Filter Headings">
                        <i class="ph ph-funnel"></i>
                    </button>
                    <button class="tool-btn" style="width: 28px; height: 28px; font-size: 16px;" onclick="resetFilter()"
                        title="Show Full Document">
                        <i class="ph ph-list-dashes"></i>
                    </button>
                </div>
            </div>

            <ul class="toc-list" id="tocList">
                <div style="padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px;">
                    Upload a document to generate headings.
                </div>
            </ul>
        </aside>

        <!-- Main Workspace -->
        <div class="main-wrapper">

            <!-- Upload Screen -->
            <div class="upload-overlay" id="uploadOverlay">
                <div class="upload-card">
                    <i class="ph-fill ph-file-arrow-up"
                        style="font-size: 48px; color: var(--primary); margin-bottom: 16px;"></i>
                    <h2 style="margin-bottom: 8px; color: var(--text-main);">Upload Word Document</h2>
                    <p style="color: var(--text-muted);">Exact MS Word formatting will be preserved.</p>
                    <input type="file" id="fileInput" accept=".docx" />
                </div>
            </div>

            <!-- Toolbar -->
            <header class="toolbar">
                <div class="toolbar-group">
                    <button class="tool-btn mobile-toggle-btn" onclick="toggleMobileSidebar()" title="Navigation Pane">
                        <i class="ph ph-sidebar-simple"></i>
                    </button>
                    <button class="tool-btn" onclick="document.getElementById('fileInput').click()" title="Open File">
                        <i class="ph ph-folder-open"></i>
                    </button>
                    <button class="tool-btn" onclick="printDoc()" title="Print">
                        <i class="ph ph-printer"></i>
                    </button>
                </div>

                <div class="toolbar-group">
                    <button class="tool-btn" id="editToggleBtn" onclick="toggleEditMode()" title="Enable Editing">
                        <i class="ph ph-pencil-simple"></i>
                    </button>
                </div>

                <div class="toolbar-group" id="ttsGroup">
                    <!-- Voice Selection -->
                    <select id="ttsVoiceSelect" onchange="changeTtsVoice()"
                        style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 4px; font-size: 11px; padding: 4px; max-width: 140px; color: var(--text-main); outline: none; margin-right: 8px;">
                        <option value="">Loading voices...</option>
                    </select>

                    <!-- Speed Controls -->
                    <button class="tool-btn" onclick="changeTtsSpeed(-0.1)" title="Slower (Decrease Speed)">
                        <i class="ph ph-minus"></i>
                    </button>
                    <span id="ttsSpeedLabel"
                        style="font-size: 13px; font-weight: 700; color: var(--primary); min-width: 44px; text-align: center;">0.85x</span>
                    <button class="tool-btn" onclick="changeTtsSpeed(0.1)" title="Faster (Increase Speed)">
                        <i class="ph ph-plus"></i>
                    </button>

                    <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>

                    <button class="tool-btn" id="ttsBtn" onclick="toggleTTS()" title="Read Aloud">
                        <i class="ph ph-speaker-high"></i>
                    </button>
                    <button class="tool-btn" id="ttsStopBtn" onclick="stopTTS()" title="Stop Reading"
                        style="display: none; color: #EF4444;">
                        <i class="ph ph-stop"></i>
                    </button>
                </div>

                <div class="toolbar-group">
                    <button class="tool-btn" onclick="changeZoom(-0.1)" title="Zoom Out">
                        <i class="ph ph-minus"></i>
                    </button>
                    <div class="zoom-control">
                        <span id="zoomLevel">100%</span>
                    </div>
                    <button class="tool-btn" onclick="changeZoom(0.1)" title="Zoom In">
                        <i class="ph ph-plus"></i>
                    </button>
                </div>

                <!-- Filter Dropdown Container -->
                <div class="toolbar-group filter-dropdown-group" id="filterDropdownGroup">
                    <button class="tool-btn" id="filterDropdownBtn" onclick="toggleFilterDropdown(event)"
                        title="Filter Options"
                        style="gap: 6px; padding: 0 12px; width: auto; font-size: 13px; font-weight: 600;">
                        <i class="ph ph-funnel" style="font-size: 16px; color: var(--primary);"></i>

                        <i class="ph ph-caret-down" id="filterDropdownCaret"

                            style="display: none; background: var(--primary); color: white; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 700;">0</span>
                    </button>

                    <!-- Filter Dropdown Popover -->
                    <div class="filter-dropdown-menu" id="filterDropdownMenu" onclick="event.stopPropagation()">
                        <div class="filter-dropdown-header">
                            <div
                                style="display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 10px;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <i class="ph-fill ph-funnel" style="color: var(--primary); font-size: 18px;"></i>
                                    <span style="font-weight: 700; font-size: 14px;">Document Filter</span>
                                </div>
                                <button class="tool-btn" style="width: 24px; height: 24px; font-size: 14px;"
                                    onclick="toggleFilterDropdown(false)" title="Close Filter">
                                    <i class="ph ph-x"></i>

                            <div class="filter-search-box" style="margin-bottom: 8px;">

                                <input type="text" id="headingSearchInput" placeholder="Search headings..."
                                    oninput="filterHeadingTreeList()">
