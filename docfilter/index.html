                            <div style="display: flex; justify-content: space-between; align-items: center; gap: 4px;">
                                <div class="filter-actions-group">
                                    <button class="btn-secondary" onclick="expandAllFilterNodes(true)"
                                        title="Expand All"><i class="ph ph-arrows-out-line"></i> Expand</button>
                                    <button class="btn-secondary" onclick="expandAllFilterNodes(false)"
                                        title="Collapse All"><i class="ph ph-arrows-in-line"></i> Collapse</button>
                                </div>
                                <div class="filter-actions-group">
                                    <button class="btn-secondary" onclick="selectAllHeadings(true)">Select All</button>
                                    <button class="btn-secondary" onclick="selectAllHeadings(false)">Clear All</button>
                                </div>
                            </div>
                        </div>

                        <!-- Section Type Filtering Controls inside Dropdown -->
                        <div
                            style="padding: 10px 14px; background: rgba(241, 245, 249, 0.7); border-bottom: 1px solid var(--border-color); font-size: 11px;">
                            <span
                                style="font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">INCLUDE
                                IN VISIBLE SECTIONS:</span>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
                                <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;"><input
                                        type="checkbox" id="chkHeading" checked onchange="applyHeadingFilter()">
                                    Headings</label>
                                <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;"><input
                                        type="checkbox" id="chkSubHeading" checked onchange="applyHeadingFilter()">
                                    Sub-Headings</label>
                                <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;"><input
                                        type="checkbox" id="chkLowerSubHeading" checked onchange="applyHeadingFilter()">
                                    Lower Sub</label>
                                <label style="cursor: pointer; display: flex; align-items: center; gap: 6px;"><input
                                        type="checkbox" id="chkPoints" checked onchange="applyHeadingFilter()">
                                    Points/Bullets</label>
                            </div>
                        </div>

                        <!-- Collapsible Tree Dropdown List -->
                        <div class="filter-dropdown-body" id="headingFilterList">
                            <!-- Dynamically populated collapsible checkbox tree list -->
                        </div>

                        <div class="filter-dropdown-footer">
                            <div class="filter-status-text" id="filterStatusText">
                                All headings & content visible
                            </div>
                            <div style="display: flex; gap: 6px;">
                                <button class="btn-secondary" onclick="resetHeadingFilterAndClose()">Show All</button>
                                <button class="btn" style="padding: 5px 12px; font-size: 12px;"
                                    onclick="toggleFilterDropdown(false)">Apply</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="toolbar-group">
                    <div class="search-bar">
                        <i class="ph ph-magnifying-glass" style="color: var(--text-muted);"></i>
                        <input type="text" id="searchInput" placeholder="Search in document..."
                            oninput="handleSearch()">
                    </div>
                </div>
            </header>

            <!-- Document View -->
            <main class="main-content" id="mainContent">
                <div id="documentContainer">
                    <!-- DOCX Preview gets injected here -->
                </div>

                <!-- Search Results Area -->
                <div id="searchResultsView"
                    style="display: none; width: 100%; max-width: 800px; flex-direction: column;">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <h2 style="font-size: 24px; font-weight: 700;">Search Results</h2>
                        <span id="searchCount"
                            style="background: var(--primary-alpha); color: var(--primary); padding: 4px 12px; border-radius: 12px; font-weight: 600; font-size: 14px;">0
                            found</span>
                    </div>
                    <div id="searchResultsList"></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        let currentZoom = 1.0;
        let isEditMode = false;
        let headings = []; // Stores { element, level, id, title }
        let selectedHeadingIndices = new Set();
        let openFilterNodes = new Set(); // Stores indices of expanded heading nodes in filter tree dropdown

        // Listen for file upload
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('uploadOverlay').classList.add('hidden');

            const container = document.getElementById('documentContainer');
            container.innerHTML = 'Loading document...';

            // Configure docx-preview
            const options = {
                className: "docx",
                inWrapper: true, // Renders pages like Word
                ignoreWidth: false,
                ignoreHeight: false,
                ignoreFonts: false,
                breakPages: true,
                ignoreLastRenderedPageBreak: false,
                experimental: false,
                trimXmlDeclaration: true,
                debug: false
            };

            docx.renderAsync(file, container, null, options)
                .then(() => {
                    console.log("Document rendered fully.");
                    buildNavigationPane();
                })
                .catch(err => {
                    console.error("Error rendering docx", err);
                    container.innerHTML = `<div style="color: red;">Error rendering document. It might be corrupted.</div>`;
                });
        });

        function changeZoom(delta) {
            currentZoom += delta;
            if (currentZoom < 0.5) currentZoom = 0.5;
            if (currentZoom > 2.0) currentZoom = 2.0;

            document.getElementById('zoomLevel').innerText = Math.round(currentZoom * 100) + '%';
            document.getElementById('documentContainer').style.transform = `scale(${currentZoom})`;
        }

        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('editToggleBtn');
            const sections = document.querySelectorAll('.docx'); // Elements created by docx-preview

            if (isEditMode) {
                btn.classList.add('active');
                sections.forEach(s => s.setAttribute('contenteditable', 'true'));
            } else {
                btn.classList.remove('active');
                sections.forEach(s => s.removeAttribute('contenteditable'));
            }
        }

        function printDoc() {
            window.print();
        }

        /**
         * Text to Speech (Read Aloud)
         */
        let ttsUtterances = [];
        let isTtsPlaying = false;
        let isTtsPaused = false;
        let ttsSpeed = 0.85;
        let currentHighlightedBlock = null;
        let currentTtsIndex = 0;
        let selectedTtsVoice = null;

        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            const select = document.getElementById('ttsVoiceSelect');

            if (voices.length === 0) {
                select.innerHTML = '<option value="">Loading voices...</option>';
                setTimeout(loadVoices, 500); // Retry until voices are loaded
                return;
            }

            // Prevent re-rendering if already loaded
            if (select.options.length > 1) return;

            select.innerHTML = '';

            let defaultIndex = 0;
            let indianIndex = -1;

            voices.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                const isOnline = v.localService === false ? " (Online)" : "";
                opt.textContent = `${v.name}${isOnline} [${v.lang}]`;
                select.appendChild(opt);

                if (v.default) defaultIndex = i;
                if (indianIndex === -1 && v.lang.includes('en-IN') && v.name.toLowerCase().includes('female')) {
                    indianIndex = i;
                } else if (indianIndex === -1 && v.lang.includes('en-IN')) {
                    indianIndex = i;
                }
            });

            // Prefer Indian voice first, then fallback to OS Default
            const chosenIndex = indianIndex !== -1 ? indianIndex : defaultIndex;
            select.value = chosenIndex;
            selectedTtsVoice = voices[chosenIndex];
        }

        // Call immediately and setup listener
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function changeTtsVoice() {
            const voices = window.speechSynthesis.getVoices();
            const select = document.getElementById('ttsVoiceSelect');
            selectedTtsVoice = voices[select.value];

            // Update currently queued future utterances
            ttsUtterances.forEach(u => u.voice = selectedTtsVoice);
        }

        function changeTtsSpeed(delta) {
            ttsSpeed += delta;
            if (ttsSpeed < 0.5) ttsSpeed = 0.5;
            if (ttsSpeed > 2.0) ttsSpeed = 2.0;
            document.getElementById('ttsSpeedLabel').innerText = ttsSpeed.toFixed(2) + 'x';

            ttsUtterances.forEach(u => u.rate = ttsSpeed);
        }

        // Word-level highlighting helpers
        function wrapWordsInNode(node) {
            // First, make sure it's clean
            unwrapWordsInNode(node);

            // Get the full textContent that SpeechSynthesis will use
            // We need charCounter to match textContent exactly
            const fullText = node.textContent;

            const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null, false);
            const textNodes = [];
            while (walker.nextNode()) {
                textNodes.push(walker.currentNode);
            }

            // Build a mapping: walk through fullText char by char
            // and also walk through textNodes to find where each text node's chars land in fullText
            let globalOffset = 0;

            textNodes.forEach(textNode => {
                const text = textNode.nodeValue;

                // Split into words and spaces
                const parts = text.split(/(\s+)/);
                const fragment = document.createDocumentFragment();

                parts.forEach(part => {
                    if (part.length === 0) return;

                    if (/\S/.test(part)) {
                        // It's a word
                        const span = document.createElement('span');
                        span.className = 'tts-word';
                        span.dataset.charStart = globalOffset;
                        span.dataset.charEnd = globalOffset + part.length;
                        span.textContent = part;
                        fragment.appendChild(span);
                    } else {
                        // It's whitespace
                        fragment.appendChild(document.createTextNode(part));
                    }
                    globalOffset += part.length;
                });

                textNode.parentNode.replaceChild(fragment, textNode);
            });
        }

        function unwrapWordsInNode(node) {
            const spans = node.querySelectorAll('.tts-word');
            spans.forEach(span => {
                const text = document.createTextNode(span.textContent);
                span.parentNode.replaceChild(text, span);
            });
            node.normalize();
        }

        function getSelectedBlockItems(selection, range) {
            const selectedText = selection.toString().trim();
            if (!selectedText || !range) return [];

            const allBlocks = Array.from(document.querySelectorAll('p, table, li, h1, h2, h3, h4, h5, h6'))
                .filter(el => el.offsetParent !== null && el.innerText.trim().length > 0);

            const intersectingBlocks = allBlocks.filter(block => {
                try {
                    const selRange = document.createRange();
                    selRange.selectNodeContents(block);
                    return range.compareBoundaryPoints(Range.END_TO_START, selRange) < 0 &&
                        range.compareBoundaryPoints(Range.START_TO_END, selRange) > 0;
                } catch (e) {
                    return false;
                }
            });

            if (intersectingBlocks.length === 0) {
                let node = range.commonAncestorContainer;
                if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
                const block = node.closest('p, table, li, h1, h2, h3, h4, h5, h6') || node;
                return [{ block: block, text: selectedText }];
            }

            return intersectingBlocks.map(block => {
                const blockText = block.textContent;
                if (blockText.includes(selectedText)) {
                    return { block: block, text: selectedText };
                }
                return { block: block, text: blockText };
            });
        }

        function toggleTTS() {
            const btn = document.getElementById('ttsBtn');
            const stopBtn = document.getElementById('ttsStopBtn');

            if (isTtsPlaying) {
                if (isTtsPaused) {
                    window.speechSynthesis.resume();
                    isTtsPaused = false;
                    btn.innerHTML = '<i class="ph ph-pause"></i>';
                } else {
                    window.speechSynthesis.pause();
                    isTtsPaused = true;
                    btn.innerHTML = '<i class="ph ph-play"></i>';
                }
                return;
            }

            // Check if user has explicitly selected/highlighted text with their mouse
            const selection = window.getSelection();
            const selectedText = selection.toString().trim();
            const range = (selection.rangeCount > 0) ? selection.getRangeAt(0) : null;

            let blockItems = [];

            if (selectedText && range) {
                blockItems = getSelectedBlockItems(selection, range);
                // Clear mouse selection so custom yellow word-highlight stands out clearly
                selection.removeAllRanges();
            } else {
                // Fallback: If no text is selected, read all visible blocks on the screen
                const allBlocks = Array.from(document.querySelectorAll('p, table, li, h1, h2, h3, h4, h5, h6'))
                    .filter(el => el.offsetParent !== null && el.innerText.trim().length > 0);

                const visibleBlocks = allBlocks.filter(el => {
                    let parent = el.parentElement;
                    while (parent) {
                        if (allBlocks.includes(parent)) return false;
                        parent = parent.parentElement;
                    }
                    return true;
                });

                blockItems = visibleBlocks.map(b => ({ block: b, text: b.textContent }));
            }

            if (blockItems.length === 0) {
                alert("No text visible to read!");
                return;
            }

            // Ensure voices are loaded
            if (!selectedTtsVoice) loadVoices();

            ttsUtterances = [];
            currentTtsIndex = 0;

            let simulatedWordInterval = null;

            blockItems.forEach((item, index) => {
                const block = item.block;
                const snippetText = item.text;

                // Calculate character offset inside the block for this snippet
                const offsetInBlock = Math.max(0, block.textContent.indexOf(snippetText));

                const u = new SpeechSynthesisUtterance(snippetText);
                if (selectedTtsVoice) u.voice = selectedTtsVoice;
                u.rate = ttsSpeed;
                u.pitch = 1.0;

                u.onstart = () => {
                    currentTtsIndex = index;

                    // Reset previous block
                    if (currentHighlightedBlock) {
                        currentHighlightedBlock.classList.remove('tts-block-active');
                        unwrapWordsInNode(currentHighlightedBlock);
                    }
                    if (simulatedWordInterval) {
                        clearInterval(simulatedWordInterval);
                    }

                    currentHighlightedBlock = block;
                    block.classList.add('tts-block-active');
                    block.scrollIntoView({ behavior: 'smooth', block: 'center' });

                    // Wrap words for precise highlighting
                    wrapWordsInNode(block);

                    // Fallback: simulated word-by-word highlight for voices without onboundary
                    const wordSpans = Array.from(block.querySelectorAll('.tts-word'))
                        .filter(s => parseInt(s.dataset.charStart) >= offsetInBlock);

                    if (wordSpans.length > 0) {
                        let wordIdx = 0;
                        const wpm = 180 * ttsSpeed;
                        const msPerWord = (60 / wpm) * 1000;

                        block.dataset.hasNativeBoundary = 'false';

                        simulatedWordInterval = setInterval(() => {
                            if (!currentHighlightedBlock || block.dataset.hasNativeBoundary === 'true') {
                                clearInterval(simulatedWordInterval);
                                return;
                            }

                            block.querySelectorAll('.tts-word-active').forEach(w => w.classList.remove('tts-word-active'));

                            if (wordIdx < wordSpans.length) {
                                wordSpans[wordIdx].classList.add('tts-word-active');
                                wordIdx++;
                            } else {
                                clearInterval(simulatedWordInterval);
                            }
                        }, msPerWord);
                    }
                };

                u.onboundary = (e) => {
                    if (e.name === 'word' && currentHighlightedBlock === block) {
                        block.dataset.hasNativeBoundary = 'true';
                        if (simulatedWordInterval) {
                            clearInterval(simulatedWordInterval);
                            simulatedWordInterval = null;
                        }

                        const targetCharIndex = offsetInBlock + e.charIndex;

                        // Clear previous word highlight
                        block.querySelectorAll('.tts-word-active').forEach(w => w.classList.remove('tts-word-active'));

                        // Find and highlight the current word by matching targetCharIndex to data-char-start/end
                        const wordSpans = block.querySelectorAll('.tts-word');
                        for (const span of wordSpans) {
                            const start = parseInt(span.dataset.charStart);
                            const end = parseInt(span.dataset.charEnd);
                            if (targetCharIndex >= start && targetCharIndex < end) {
                                span.classList.add('tts-word-active');
                                break;
                            }
                        }
                    }
                };

                u.onend = () => {
                    if (simulatedWordInterval) {
                        clearInterval(simulatedWordInterval);
                        simulatedWordInterval = null;
                    }
                    if (currentHighlightedBlock === block) {
                        block.classList.remove('tts-block-active');
                        unwrapWordsInNode(block);
                        currentHighlightedBlock = null;
                    }
                    if (index === blockItems.length - 1) {
                        stopTTS();
                    }
                };

                ttsUtterances.push(u);
            });

            ttsUtterances.forEach(u => window.speechSynthesis.speak(u));

            isTtsPlaying = true;
            isTtsPaused = false;
            btn.innerHTML = '<i class="ph ph-pause"></i>';
            btn.classList.add('active');
            stopBtn.style.display = 'flex';
        }

        function stopTTS() {
            window.speechSynthesis.cancel();
            isTtsPlaying = false;
            isTtsPaused = false;

            if (currentHighlightedBlock) {
                currentHighlightedBlock.classList.remove('tts-block-active');
                unwrapWordsInNode(currentHighlightedBlock);
                currentHighlightedBlock = null;
            }

            const btn = document.getElementById('ttsBtn');
            btn.innerHTML = '<i class="ph ph-speaker-high"></i>';
            btn.classList.remove('active');
            document.getElementById('ttsStopBtn').style.display = 'none';
        }

        // Initialize voices
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => { console.log("Voices loaded."); };
        }

        /**
         * Navigation Pane (TOC) & Filtering Logic
         */
        function buildNavigationPane() {
            selectedHeadingIndices.clear();
            updateFilterStatusText();

            const container = document.getElementById('documentContainer');
            const allParagraphs = Array.from(container.querySelectorAll('p, h1, h2, h3, h4, h5, h6'));

            headings = [];
            let headingCounter = 0;
            const candidateHeadings = [];

            // Common sentence verbs to filter out false headings (body paragraphs)
            const sentenceVerbs = [' is ', ' are ', ' was ', ' were ', ' has been ', ' have been ', ' became ', ' appointed ', ' replaces ', ' replacing ', ' served '];
            // Category keywords that indicate level 2 sub-sections
            const subCategoryKeywords = ['national', 'international', 'state level', 'defense', 'security', 'corporate', 'ambassadorial', 'judicial', 'category', 'part ', 'section '];

            allParagraphs.forEach((el, index) => {
                const text = el.innerText ? el.innerText.trim() : '';
                if (!text || text.length > 100) return; // Skip empty or long sentence paragraphs

                // Filter out sentences with colons, periods, or verbs
                if (text.includes(': ') || text.includes(' : ') || text.endsWith('.')) return;
                const textLower = ' ' + text.toLowerCase() + ' ';
                if (sentenceVerbs.some(verb => textLower.includes(verb))) return;

                const tagName = el.tagName.toLowerCase();
                const className = el.className || '';
                const style = window.getComputedStyle(el);

                let isBold = style.fontWeight >= 600 || style.fontWeight === 'bold';
                let fontSizePx = parseFloat(style.fontSize) || 12;

                const children = el.querySelectorAll('*');
                if (!isBold && children.length > 0) {
                    for (let child of children) {
                        const childStyle = window.getComputedStyle(child);
                        if (parseInt(childStyle.fontWeight) >= 600 || childStyle.fontWeight === 'bold') {
                            isBold = true;
                        }
                        const cSize = parseFloat(childStyle.fontSize);
                        if (cSize > fontSizePx) {
                            fontSizePx = cSize;
                        }
                    }
                }

                let explicitLevel = null;
                if (tagName.match(/^h[1-6]$/)) {
                    explicitLevel = parseInt(tagName.charAt(1));
                } else {
                    const match = className.match(/heading[_-]?([1-6])/i);
                    if (match) {
                        explicitLevel = parseInt(match[1]);
                    } else if (/title/i.test(className)) {
                        explicitLevel = 1;
                    } else if (/subtitle/i.test(className)) {
                        explicitLevel = 2;
                    }
                }

                if (isBold || explicitLevel !== null) {
                    candidateHeadings.push({
                        el,
                        text,
                        index,
                        explicitLevel,
                        fontSizePx,
                        isCategoryKeyword: subCategoryKeywords.some(kw => textLower.includes(kw))
                    });
                }

                el.dataset.domIndex = index;
            });

            if (candidateHeadings.length === 0) {
                headings = [];
                renderTOC();
                return;
            }

            // Collect distinct font sizes for dynamic ranking
            const distinctFontSizes = Array.from(new Set(candidateHeadings.map(c => c.fontSizePx)))
                .sort((a, b) => b - a);

            candidateHeadings.forEach((c) => {
                let level = 1;

                if (c.explicitLevel !== null) {
                    level = c.explicitLevel;
                } else if (distinctFontSizes.length > 1) {
                    // Assign level based on font size rank
                    const fontRank = distinctFontSizes.indexOf(c.fontSizePx);
                    level = fontRank + 1;
                } else {
                    // All candidate headings have identical font size!
                    // If it's a category keyword and we already have a previous Level 1 heading, make it Level 2
                    if (c.isCategoryKeyword && headings.length > 0) {
                        level = 2;
                    } else {
                        level = 1;
                    }
                }

                c.el.dataset.headingId = `heading-${headingCounter}`;
                c.el.dataset.headingLevel = level;

                headings.push({
                    id: `heading-${headingCounter}`,
                    element: c.el,
                    level: Math.max(1, level), // Infinite levels supported (L1, L2, L3, L4, L5...)
                    title: c.text,
                    domIndex: c.index
                });
                headingCounter++;
            });

            renderTOC();
        }

        function renderTOC() {
            const tocList = document.getElementById('tocList');
            tocList.innerHTML = '';

            if (headings.length === 0) {
                tocList.innerHTML = `<div style="padding: 16px; color: var(--text-muted); font-size: 13px;">No headings found in document.</div>`;
                return;
            }

            // Build a hierarchical tree (handles arbitrary depth)
            const tree = [];
            const stack = [];

            headings.forEach((heading, idx) => {
                const node = { ...heading, arrayIndex: idx, children: [] };

                while (stack.length > 0 && stack[stack.length - 1].level >= heading.level) {
                    stack.pop();
                }

                if (stack.length === 0) {
                    tree.push(node);
                } else {
                    stack[stack.length - 1].children.push(node);
                }

                stack.push(node);
            });

            function buildHtml(nodes) {
                let html = '';
                nodes.forEach(node => {
                    const hasChildren = node.children.length > 0;
                    const iconHtml = hasChildren
                        ? `<div class="toc-icon" onclick="toggleTocNode(event, this)"><i class="ph-bold ph-caret-right"></i></div>`
                        : `<div class="toc-icon" style="opacity: 0.5;"><i class="ph-bold ph-dot-outline" style="font-size: 12px;"></i></div>`;

                    let itemStyle = 'font-size: 12px; font-weight: 400; color: var(--text-muted);';
                    if (node.level === 1) {
                        itemStyle = 'font-size: 14px; font-weight: 700; color: var(--text-main);';
                    } else if (node.level === 2) {
                        itemStyle = 'font-size: 13px; font-weight: 600; color: var(--text-main);';
                    } else if (node.level === 3) {
                        itemStyle = 'font-size: 12.5px; font-weight: 500; color: var(--text-main);';
                    }

                    html += `
                        <li class="toc-item-wrapper" style="margin-bottom: 2px;">
                            <div class="toc-item level-${node.level}" id="toc-node-${node.arrayIndex}" style="display: flex; align-items: center; padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s ease;">
                                ${iconHtml}
                                <span class="toc-text" onclick="filterToHeading(${node.arrayIndex})" style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; ${itemStyle}">${node.title}</span>
                            </div>
                            ${hasChildren ? `<ul class="toc-sublist" style="display: none; list-style: none; padding-left: 14px; margin-left: 10px; border-left: 1.5px dashed rgba(148, 163, 184, 0.4); margin-top: 2px; margin-bottom: 2px;">${buildHtml(node.children)}</ul>` : ''}
                        </li>
                    `;
                });
                return html;
            }

            tocList.innerHTML = buildHtml(tree);
        }

        function toggleTocNode(event, iconContainer) {
            event.stopPropagation();
            const icon = iconContainer.querySelector('i');
            const wrapper = iconContainer.closest('.toc-item-wrapper');
            const sublist = wrapper ? wrapper.querySelector(':scope > .toc-sublist') : null;

            if (!icon) return;

            const isExpanded = icon.classList.contains('ph-caret-down');

            if (isExpanded) {
                // Collapse
                icon.className = 'ph-bold ph-caret-right';
                if (sublist) {
                    sublist.style.maxHeight = '0px';
                    sublist.style.opacity = '0';
                    sublist.style.overflow = 'hidden';
                    setTimeout(() => { sublist.style.display = 'none'; }, 200);
                }
            } else {
                // Expand
                icon.className = 'ph-bold ph-caret-down';
                if (sublist) {
                    sublist.style.display = 'block';
                    sublist.style.overflow = 'hidden';
                    sublist.style.maxHeight = '0px';
                    sublist.style.opacity = '0';
                    // Trigger reflow then animate
                    requestAnimationFrame(() => {
                        sublist.style.transition = 'max-height 0.3s ease, opacity 0.3s ease';
                        sublist.style.maxHeight = sublist.scrollHeight + 'px';
                        sublist.style.opacity = '1';
                        // Clean up after animation
                        setTimeout(() => {
                            sublist.style.maxHeight = 'none';
                            sublist.style.overflow = 'visible';
                            sublist.style.transition = '';
                        }, 300);
                    });
                }
            }
        }

        function resetFilter() {
            selectedHeadingIndices.clear();
            openFilterNodes.clear();
            updateFilterStatusText();

            // Show all elements
            const container = document.getElementById('documentContainer');
            if (container) {
                const allElements = container.querySelectorAll('*');
                allElements.forEach(el => el.classList.remove('hidden-node'));
            }

            // Remove active from TOC
            document.querySelectorAll('.toc-item').forEach(el => el.classList.remove('active'));

            const menu = document.getElementById('filterDropdownMenu');
            if (menu && menu.classList.contains('active')) {
                renderHeadingFilterList();
            }
        }

        /**
         * Heading Filter Dropdown & Collapsible Multi-Select Logic
         */
        function toggleFilterDropdown(forceState) {
            const menu = document.getElementById('filterDropdownMenu');
            const caret = document.getElementById('filterDropdownCaret');
            if (!menu) return;

            let isOpening;
            if (typeof forceState === 'boolean') {
                isOpening = forceState;
            } else {
                isOpening = !menu.classList.contains('active');
            }

            if (isOpening) {
                menu.classList.add('active');
                if (caret) caret.style.transform = 'rotate(180deg)';
                renderHeadingFilterList();
            } else {
                menu.classList.remove('active');
                if (caret) caret.style.transform = 'rotate(0deg)';
            }
        }

        // Close filter dropdown popover on outside click
        document.addEventListener('click', (e) => {
            const dropdownGroup = document.getElementById('filterDropdownGroup');
            if (dropdownGroup && !dropdownGroup.contains(e.target)) {
                toggleFilterDropdown(false);
            }
        });

        function renderHeadingFilterList(filterQuery = '') {
            const container = document.getElementById('headingFilterList');
            if (!container) return;
            container.innerHTML = '';

            if (!headings || headings.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 32px 16px; color: var(--text-muted);">
                        <i class="ph ph-list-checks" style="font-size: 36px; margin-bottom: 8px; opacity: 0.5;"></i>
                        <p style="font-size: 13px; font-weight: 500;">No headings found in this document.</p>
                        <p style="font-size: 11px; margin-top: 4px; color: var(--text-muted);">Upload a Word document to filter by headings.</p>
                    </div>
                `;
                updateFilterStatusText();
                return;
            }

            const query = (filterQuery || '').toLowerCase().trim();

            // Build hierarchical tree structure
            const tree = [];
            const stack = [];

            headings.forEach((heading, idx) => {
                const node = { heading, idx, children: [] };
                while (stack.length > 0 && stack[stack.length - 1].heading.level >= heading.level) {
                    stack.pop();
                }
                if (stack.length === 0) {
                    tree.push(node);
                } else {
                    stack[stack.length - 1].children.push(node);
                }
                stack.push(node);
            });

            function renderNodes(nodes) {
                let html = '';
                nodes.forEach(node => {
                    if (query && !node.heading.title.toLowerCase().includes(query)) {
                        const hasMatchingChild = (n) => n.heading.title.toLowerCase().includes(query) || n.children.some(hasMatchingChild);
                        if (!hasMatchingChild(node)) return;
                    }

                    const hasChildren = node.children.length > 0;
                    const isChecked = selectedHeadingIndices.has(node.idx);
                    const isExpanded = openFilterNodes.has(node.idx);

                    let badgeClass = 'l3';
                    if (node.heading.level === 1) badgeClass = 'l1';
                    else if (node.heading.level === 2) badgeClass = 'l2';

                    const chevronHtml = hasChildren
                        ? `<span class="chevron-toggle ${isExpanded ? 'expanded' : ''}" onclick="toggleHeadingCollapse(${node.idx}, event)"><i class="ph-bold ph-caret-right"></i></span>`
                        : `<span class="chevron-spacer"></span>`;

                    html += `
                        <div class="filter-tree-node">
                            <div class="filter-tree-row" onclick="if(event.target.tagName !== 'INPUT' && !event.target.closest('.chevron-toggle')) toggleHeadingSelection(${node.idx}, event)">
                                ${chevronHtml}
                                <input type="checkbox" id="chk-heading-${node.idx}" ${isChecked ? 'checked' : ''} onchange="toggleHeadingSelection(${node.idx}, event)">
                                <span class="level-badge ${badgeClass}">H${node.heading.level}</span>
                                <span class="filter-tree-text" title="${node.heading.title}">${node.heading.title}</span>
                            </div>
                            ${hasChildren ? `
                                <div class="filter-tree-children ${isExpanded ? 'expanded' : ''}" id="children-heading-${node.idx}">
                                    ${renderNodes(node.children)}
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                return html;
            }

            const treeHtml = renderNodes(tree);
            if (!treeHtml) {
                container.innerHTML = `<div style="text-align: center; padding: 24px 16px; color: var(--text-muted); font-size: 13px;">No headings match "${filterQuery}"</div>`;
            } else {
                container.innerHTML = treeHtml;
            }

            updateFilterStatusText();
        }

        function toggleHeadingCollapse(idx, event) {
            if (event) event.stopPropagation();

            const childrenContainer = document.getElementById(`children-heading-${idx}`);
            if (!childrenContainer) return;

            const row = childrenContainer.previousElementSibling;
            const chevron = row ? row.querySelector('.chevron-toggle') : null;

            if (openFilterNodes.has(idx)) {
                openFilterNodes.delete(idx);
                childrenContainer.style.display = 'none';
                childrenContainer.classList.remove('expanded');
                if (chevron) chevron.classList.remove('expanded');
            } else {
                openFilterNodes.add(idx);
                childrenContainer.style.display = 'block';
                childrenContainer.classList.add('expanded');
                if (chevron) chevron.classList.add('expanded');
            }
        }

        function expandAllFilterNodes(expand = true) {
            if (expand) {
                headings.forEach((_, idx) => openFilterNodes.add(idx));
            } else {
                openFilterNodes.clear();
            }
            const searchInput = document.getElementById('headingSearchInput');
            renderHeadingFilterList(searchInput ? searchInput.value : '');
        }

        function toggleHeadingSelection(idx, event) {
            if (event) event.stopPropagation();

            const isCurrentlyChecked = selectedHeadingIndices.has(idx);
            const targetHeading = headings[idx];

            // Collect child sub-headings under this heading
            const childIndices = [];
            if (targetHeading) {
                for (let i = idx + 1; i < headings.length; i++) {
                    if (headings[i].level > targetHeading.level) {
                        childIndices.push(i);
                    } else {
                        break;
                    }
                }
            }

            if (isCurrentlyChecked) {
                selectedHeadingIndices.delete(idx);
                childIndices.forEach(childIdx => selectedHeadingIndices.delete(childIdx));
            } else {
                selectedHeadingIndices.add(idx);
                childIndices.forEach(childIdx => selectedHeadingIndices.add(childIdx));
            }

            const searchInput = document.getElementById('headingSearchInput');
            renderHeadingFilterList(searchInput ? searchInput.value : '');
            applyHeadingFilter();
        }

        function selectAllHeadings(select = true) {
            if (select) {
                headings.forEach((_, idx) => selectedHeadingIndices.add(idx));
            } else {
                selectedHeadingIndices.clear();
            }
            const searchInput = document.getElementById('headingSearchInput');
            renderHeadingFilterList(searchInput ? searchInput.value : '');
            applyHeadingFilter();
        }

        function filterHeadingTreeList() {
            const query = document.getElementById('headingSearchInput').value;
            renderHeadingFilterList(query);
        }

        function updateFilterStatusText() {
            const statusText = document.getElementById('filterStatusText');
            const badge = document.getElementById('activeFilterBadge');

            const count = selectedHeadingIndices.size;
            const total = headings.length;

            if (count === 0 || count === total) {
                if (statusText) statusText.innerText = "All headings & content visible";
                if (badge) {
                    badge.style.display = 'none';
                }
            } else {
                if (statusText) statusText.innerText = `${count} of ${total} heading section(s) visible`;
                if (badge) {
                    badge.style.display = 'inline-block';
                    badge.innerText = `${count}`;
                }
            }
        }

        function applyHeadingFilter() {
            updateFilterStatusText();

            const container = document.getElementById('documentContainer');
            if (!container) return;

            const incHeading = document.getElementById('chkHeading') ? document.getElementById('chkHeading').checked : true;
            const incSubHeading = document.getElementById('chkSubHeading') ? document.getElementById('chkSubHeading').checked : true;
            const incLowerSubHeading = document.getElementById('chkLowerSubHeading') ? document.getElementById('chkLowerSubHeading').checked : true;
            const incPoints = document.getElementById('chkPoints') ? document.getElementById('chkPoints').checked : true;

            if (selectedHeadingIndices.size === 0 || selectedHeadingIndices.size === headings.length) {
                const allBlocks = container.querySelectorAll('p, table, li, h1, h2, h3, h4, h5, h6');
                allBlocks.forEach(b => b.classList.remove('hidden-node'));

                const pages = container.querySelectorAll('section.docx, .docx-wrapper > section');
                pages.forEach(page => page.classList.remove('hidden-node'));

                document.querySelectorAll('.toc-item').forEach(el => el.classList.remove('active'));
                return;
            }

            // Collect ranges for checked headings
            const ranges = [];
            selectedHeadingIndices.forEach(idx => {
                const h = headings[idx];
                if (!h) return;
                const startDomIndex = parseInt(h.element.dataset.domIndex);

                let endDomIndex = Infinity;
                for (let i = idx + 1; i < headings.length; i++) {
                    if (headings[i].level <= h.level) {
                        endDomIndex = parseInt(headings[i].element.dataset.domIndex);
                        break;
                    }
                }
                ranges.push({ start: startDomIndex, end: endDomIndex });
            });

            const allBlocks = Array.from(container.querySelectorAll('p, table, li, h1, h2, h3, h4, h5, h6'));

            allBlocks.forEach(block => {
                if (block.dataset.domIndex === undefined) return;
                const bIdx = parseInt(block.dataset.domIndex);
                const inRange = ranges.some(r => bIdx >= r.start && bIdx < r.end);

                if (!inRange) {
                    block.classList.add('hidden-node');
                    return;
                }

                // Check type filtering within selected range
                const matchingHeading = headings.find(h => h.domIndex === bIdx);
                let shouldShow = false;

                if (matchingHeading) {
                    if (matchingHeading.level === 1 && incHeading) shouldShow = true;
                    else if (matchingHeading.level === 2 && incSubHeading) shouldShow = true;
                    else if (matchingHeading.level >= 3 && incLowerSubHeading) shouldShow = true;
                } else {
                    if (incPoints) shouldShow = true;
                }

                if (shouldShow) {
                    block.classList.remove('hidden-node');
                } else {
                    block.classList.add('hidden-node');
                }
            });

            // Hide empty docx pages strictly so unselected content is completely gone
            const pages = container.querySelectorAll('section.docx, .docx-wrapper > section');
            pages.forEach(page => {
                const visibleChildren = Array.from(page.querySelectorAll('p, table, li, h1, h2, h3, h4, h5, h6'))
                    .filter(child => !child.classList.contains('hidden-node'));
                if (visibleChildren.length === 0) {
                    page.classList.add('hidden-node');
                } else {
                    page.classList.remove('hidden-node');
                }
            });

            // Highlight active TOC nodes
            document.querySelectorAll('.toc-item').forEach(el => {
                const nodeIdxStr = el.id.replace('toc-node-', '');
                const nodeIdx = parseInt(nodeIdxStr);
                if (!isNaN(nodeIdx) && selectedHeadingIndices.has(nodeIdx)) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function resetHeadingFilterAndClose() {
            selectedHeadingIndices.clear();
            resetFilter();
            toggleFilterDropdown(false);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                toggleFilterDropdown(false);
            }
        });

        function toggleMobileSidebar(forceState) {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            let isOpening;
            if (typeof forceState === 'boolean') {
                isOpening = forceState;
            } else {
                isOpening = !sidebar.classList.contains('mobile-open');
            }

            if (isOpening) {
                sidebar.classList.add('mobile-open');
                if (overlay) overlay.classList.add('active');
            } else {
                sidebar.classList.remove('mobile-open');
                if (overlay) overlay.classList.remove('active');
            }
        }

        function filterToHeading(headingIndex) {
            const targetHeading = headings[headingIndex];
            if (!targetHeading) return;

            // Auto-close sidebar menu on mobile after choosing a heading
            if (window.innerWidth <= 768) {
                toggleMobileSidebar(false);
            }

            // Highlight active in TOC using accurate IDs
            document.querySelectorAll('.toc-item').forEach(el => {
                if (el.id === `toc-node-${headingIndex}`) {
                    el.classList.add('active');
                    // Auto-expand sublist if collapsed
                    const wrapper = el.closest('.toc-item-wrapper');
                    const sublist = wrapper ? wrapper.querySelector(':scope > .toc-sublist') : null;
                    const icon = el.querySelector('.toc-icon i');
                    if (sublist && icon && icon.classList.contains('ph-caret-right')) {
                        toggleTocNode({ stopPropagation: () => { } }, el.querySelector('.toc-icon'));
                    }
                } else {
                    el.classList.remove('active');
                }
            });

            // Filtering logic:
            // Hide everything that is NOT between `targetHeading` and the NEXT heading of the same or higher priority (level <= targetHeading.level).
            let endDomIndex = Infinity;
            for (let i = headingIndex + 1; i < headings.length; i++) {
                if (headings[i].level <= targetHeading.level) {
                    endDomIndex = parseInt(headings[i].element.dataset.domIndex);
                    break;
                }
            }

            const startDomIndex = parseInt(targetHeading.element.dataset.domIndex);

            // Hide/Show logic for all elements in document
            const container = document.getElementById('documentContainer');
            const allBlocks = Array.from(container.querySelectorAll('p, table, li, h1, h2, h3, h4, h5, h6'));

            allBlocks.forEach(block => {
                if (block.dataset.domIndex === undefined) return;
                const idx = parseInt(block.dataset.domIndex);
                if (idx >= startDomIndex && idx < endDomIndex) {
                    block.classList.remove('hidden-node');
                } else {
                    block.classList.add('hidden-node');
                }
            });

            // Hide empty docx page wrappers so empty pages don't leave giant blank white gaps
            const pages = container.querySelectorAll('section.docx, .docx-wrapper > section');
            pages.forEach(page => {
                const visibleChildren = Array.from(page.querySelectorAll('p, table, li, h1, h2, h3, h4, h5, h6'))
                    .filter(child => !child.classList.contains('hidden-node'));
                if (visibleChildren.length === 0) {
                    page.classList.add('hidden-node');
                } else {
                    page.classList.remove('hidden-node');
                }
            });

            // Scroll directly to the active heading element
            setTimeout(() => {
                targetHeading.element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
        }

        function highlightTextNodes(element, query) {
            const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
            const nodesToReplace = [];
            let node;
            while (node = walker.nextNode()) {
                if (node.nodeValue.toLowerCase().includes(query)) {
                    nodesToReplace.push(node);
                }
            }

            nodesToReplace.forEach(textNode => {
                const regex = new RegExp(`(${query})`, 'gi');
                const fragment = document.createDocumentFragment();
                let lastIndex = 0;
                let match;
                while ((match = regex.exec(textNode.nodeValue)) !== null) {
                    if (match.index > lastIndex) {
                        fragment.appendChild(document.createTextNode(textNode.nodeValue.substring(lastIndex, match.index)));
                    }
                    const mark = document.createElement('mark');
                    mark.textContent = match[0];
                    fragment.appendChild(mark);
                    lastIndex = regex.lastIndex;
                }
                if (lastIndex < textNode.nodeValue.length) {
                    fragment.appendChild(document.createTextNode(textNode.nodeValue.substring(lastIndex)));
                }
                textNode.parentNode.replaceChild(fragment, textNode);
            });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('documentContainer');
            const searchView = document.getElementById('searchResultsView');
            const searchList = document.getElementById('searchResultsList');

            const incHeading = document.getElementById('chkHeading').checked;
            const incSubHeading = document.getElementById('chkSubHeading').checked;
            const incLowerSubHeading = document.getElementById('chkLowerSubHeading').checked;
            const incPoints = document.getElementById('chkPoints').checked;

            if (query.length < 3) {
                if (headings.length > 0) resetFilter();
                container.style.display = 'flex';
                searchView.style.display = 'none';
                return;
            }

            container.style.display = 'none';
            searchView.style.display = 'flex';
            searchList.innerHTML = '';

            document.querySelectorAll('.toc-item').forEach(el => el.classList.remove('active'));

            // Include li elements for bullet points!
            const allBlocks = Array.from(container.querySelectorAll('p, table, li, h1, h2, h3, h4, h5, h6'));
            let matchCount = 0;
            let skipUntilIdx = -1;

            allBlocks.forEach((block, idx) => {
                if (idx < skipUntilIdx) return;

                const text = block.innerText;
                if (!text) return;

                if (text.toLowerCase().includes(query)) {
                    matchCount++;

                    const resEl = document.createElement('div');
                    resEl.className = 'search-result-item';

                    const textDiv = document.createElement('div');
                    textDiv.className = 'search-result-text';

                    // Always try to find the parent heading for this block
                    let targetHeading = null;
                    for (let i = headings.length - 1; i >= 0; i--) {
                        if (headings[i].domIndex <= parseInt(block.dataset.domIndex)) {
                            targetHeading = headings[i];
                            break;
                        }
                    }

                    // If we have a heading and want to show the section context
                    if (targetHeading) {
                        // Find end index for this section
                        let endDomIndex = Infinity;
                        for (let i = 0; i < headings.length; i++) {
                            if (headings[i].domIndex > targetHeading.domIndex && headings[i].level <= targetHeading.level) {
                                endDomIndex = headings[i].domIndex;
                                break;
                            }
                        }

                        // Find where this section starts in allBlocks
                        let startArrIdx = 0;
                        for (let j = 0; j < allBlocks.length; j++) {
                            if (parseInt(allBlocks[j].dataset.domIndex) >= targetHeading.domIndex) {
                                startArrIdx = j;
                                break;
                            }
                        }

                        for (let j = startArrIdx; j < allBlocks.length; j++) {
                            const bIdx = parseInt(allBlocks[j].dataset.domIndex);
                            if (bIdx >= endDomIndex) {
                                skipUntilIdx = j;
                                break;
                            }

                            // Determine block type to check against user tick points
                            const childHeadingMatch = headings.find(h => h.domIndex === bIdx);
                            let shouldInclude = false;

                            if (childHeadingMatch) {
                                if (childHeadingMatch.level === 1 && incHeading) shouldInclude = true;
                                else if (childHeadingMatch.level === 2 && incSubHeading) shouldInclude = true;
                                else if (childHeadingMatch.level >= 3 && incLowerSubHeading) shouldInclude = true;
                            } else {
                                if (incPoints) shouldInclude = true;
                            }

                            if (shouldInclude) {
                                const clonedBlock = allBlocks[j].cloneNode(true);
                                highlightTextNodes(clonedBlock, query);
                                textDiv.appendChild(clonedBlock);
                            }

                            if (j === allBlocks.length - 1) skipUntilIdx = allBlocks.length;
                        }
                    } else {
                        // Normal single block fallback if no heading found
                        const clonedBlock = block.cloneNode(true);
                        highlightTextNodes(clonedBlock, query);
                        textDiv.appendChild(clonedBlock);
                    }

                    const metaDiv = document.createElement('div');
                    metaDiv.style.cssText = "font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;";
                    metaDiv.innerHTML = `<i class="ph-fill ph-folder-notch"></i> ${targetHeading ? targetHeading.title : 'Document'}`;

                    resEl.appendChild(metaDiv);
                    resEl.appendChild(textDiv);

                    resEl.onclick = () => {
                        document.getElementById('searchInput').value = '';
                        container.style.display = 'flex';
                        searchView.style.display = 'none';

                        resetFilter();

                        block.scrollIntoView({ behavior: 'smooth', block: 'center' });

                        const oldBg = block.style.backgroundColor;
                        block.style.backgroundColor = 'rgba(250, 204, 21, 0.4)';
                        block.style.transition = 'background-color 0.5s ease';
                        setTimeout(() => { block.style.backgroundColor = oldBg; }, 2000);
                    };

                    searchList.appendChild(resEl);
                }
            });

            document.getElementById('searchCount').innerText = `${matchCount} section(s) found`;

            if (matchCount === 0) {
                searchList.innerHTML = `
                    <div style="text-align: center; padding: 64px 24px; color: var(--text-muted);">
                        <i class="ph ph-magnifying-glass" style="font-size: 64px; color: var(--border-color); margin-bottom: 16px;"></i>
                        <h3>No matches found</h3>
                        <p style="margin-top: 8px;">Try searching for a different keyword.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
